name: Build & Release PrivateWallet

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

jobs:
  # ==========================================
  # 0. ANÁLISE E VALIDAÇÃO ESTÁTICA
  # ==========================================
  validate:
    name: Code Analysis & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

  # ==========================================
  # 1. ANDROID (APK) & LINUX (DEB)
  # ==========================================
  build-ubuntu:
    name: Build Android & Linux
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Build APK
      - name: Build Android APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk privatewallet-android.apk

      # Build Linux Desktop & Package .deb
      - name: Build Linux Desktop
        run: flutter build linux --release

      - name: Package Linux .deb
        run: |
          APP_NAME="privatewallet"
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            [0-9]*) ;;
            *) VERSION="1.0.0" ;;
          esac
          ARCH="amd64"
          STAGE_DIR="deb-package/${APP_NAME}_${VERSION}_${ARCH}"

          mkdir -p "$STAGE_DIR/usr/bin"
          mkdir -p "$STAGE_DIR/usr/lib/$APP_NAME"
          mkdir -p "$STAGE_DIR/usr/share/applications"
          mkdir -p "$STAGE_DIR/DEBIAN"

          cp -r build/linux/x64/release/bundle/* "$STAGE_DIR/usr/lib/$APP_NAME/"
          ln -s "/usr/lib/$APP_NAME/private_wallet" "$STAGE_DIR/usr/bin/$APP_NAME"

          cat <<EOF > "$STAGE_DIR/DEBIAN/control"
          Package: $APP_NAME
          Version: $VERSION
          Architecture: $ARCH
          Maintainer: Aldo Barduco Neto
          Description: PrivateWallet non-custodial cryptocurrency wallet application
          EOF

          cat <<EOF > "$STAGE_DIR/usr/share/applications/$APP_NAME.desktop"
          [Desktop Entry]
          Name=PrivateWallet
          Exec=/usr/bin/$APP_NAME
          Terminal=false
          Type=Application
          Categories=Finance;Utility;
          EOF

          dpkg-deb --build "$STAGE_DIR"
          mv "deb-package/${APP_NAME}_${VERSION}_${ARCH}.deb" privatewallet-linux.deb

      - name: Upload Artifacts (Ubuntu)
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-artifacts
          retention-days: 7
          path: |
            privatewallet-android.apk
            privatewallet-linux.deb

  # ==========================================
  # 2. WINDOWS (EXE com Inno Setup)
  # ==========================================
  build-windows:
    name: Build Windows
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create Inno Setup Script & Compile Installer
        shell: pwsh
        run: |
          $rawVer = "${{ github.ref_name }}"
          $appVer = if ($rawVer -match '^v?(\d+\.\d+\.\d+.*)$') { $matches[1] } else { "1.0.0" }
          $issContent = @"
          [Setup]
          AppName=PrivateWallet
          AppVersion=$appVer
          DefaultDirName={autopf}\PrivateWallet
          DefaultGroupName=PrivateWallet
          OutputDir=.
          OutputBaseFilename=PrivateWallet-Setup
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\PrivateWallet"; Filename: "{app}\private_wallet.exe"
          Name: "{autodesktop}\PrivateWallet"; Filename: "{app}\private_wallet.exe"
          "@
          Set-Content -Path "installer.iss" -Value $issContent
          ISCC.exe installer.iss

      - name: Upload Artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          retention-days: 7
          path: PrivateWallet-Setup.exe

  # ==========================================
  # 3. MACOS & IOS (DMG e IPA)
  # ==========================================
  build-macos-ios:
    name: Build macOS & iOS
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Build macOS & DMG
      - name: Build macOS Desktop
        run: flutter build macos --release

      - name: Create DMG
        run: |
          hdiutil create -volname "PrivateWallet" -srcfolder "build/macos/Build/Products/Release/private_wallet.app" -ov -format UDZO privatewallet-macos.dmg

      # Build iOS IPA (unsigned payload)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 privatewallet-ios.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts (macOS & iOS)
        uses: actions/upload-artifact@v4
        with:
          name: apple-artifacts
          retention-days: 7
          path: |
            privatewallet-macos.dmg
            privatewallet-ios.ipa

  # ==========================================
  # 4. PUBLISH TO GITHUB RELEASES
  # ==========================================
  release:
    name: Create GitHub Release
    if: github.event_name != 'pull_request'
    needs: [build-ubuntu, build-windows, build-macos-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag and Title
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="Release $TAG_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            [ -z "$VERSION" ] && VERSION="1.0.0"
            TAG_NAME="v$VERSION"
            RELEASE_NAME="Release $TAG_NAME (Build ${{ github.run_number }})"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Standardize Filenames
        run: |
          cd release_assets
          [ -f "app-release.apk" ] && mv app-release.apk privatewallet-android.apk
          [ -f "build/app/outputs/flutter-apk/app-release.apk" ] && mv build/app/outputs/flutter-apk/app-release.apk privatewallet-android.apk
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/privatewallet-android.apk
            release_assets/privatewallet-linux.deb
            release_assets/PrivateWallet-Setup.exe
            release_assets/privatewallet-macos.dmg
            release_assets/privatewallet-ios.ipa
