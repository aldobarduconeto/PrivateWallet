# Configuração do analisador Dart/Flutter para o Private Wallet.

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    unnecessary_import: ignore

linter:
  rules:
    - avoid_print
